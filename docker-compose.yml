name: guardia-notturna

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: gn-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: guardia-notturna-dev
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [gn]

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: gn-opensearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Dev only. Production runs with the security plugin enabled.
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [gn]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gn-gateway
    ports:
      - "8000:8000"
    environment:
      GN_ENV: development
      GN_KAFKA_BOOTSTRAP: kafka:9092
      GN_OPENSEARCH_URL: http://opensearch:9200
    env_file:
      - path: .env
        required: false
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [gn]

volumes:
  opensearch-data:

networks:
  gn:
    driver: bridge
