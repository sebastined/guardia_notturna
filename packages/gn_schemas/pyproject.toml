[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gn-schemas"
version = "0.1.0"
description = "Shared wire contracts for Guardia Notturna services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "gn-scoring>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
